[tool.poetry]
name = "yivi-portal"
version = "0.1.0"
description = ""
authors = ["Job Doesburg <job.doesburg@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.12"
django = "^6.0"
django-phonenumber-field= {extras = ["phonenumberslite"], version = "^8.1.0"}
dnspython = "^2.8.0"
httpx = "^0.28.0"
cryptography = "^49.0.0"
idna = "^3.10"
aioquic = "^1.3.0"
pillow = ">=10.1,<14.0"
django-bootstrap5 = ">=26.2"
requests = "^2.34.0"
djangorestframework = "^3.17.0"
fqdn = "^1.5.1"
django-imagekit = "^6.1.0"
drf-yasg = "^1.21.8"
django-cors-headers = "^4.9.0"
djangorestframework-simplejwt = "^5.5.0"
pyjwt = "^2.13.0"
pyopenssl = "^26.3.0"
xmltodict= "^1.0.4"
python-dotenv = "^1.2.2"
django_countries = "^9.0.0"
django-model-utils = "^5.0.0"

[tool.poetry.group.dev.dependencies]
black = ">=23.12.1,<27.0.0"

[tool.poetry.group.prod.dependencies]
uwsgi = "^2.0.23"
psycopg2-binary = "^2.9.1"

[tool.ruff]
# Django writes the migration files; linting generated code adds noise and the
# fixes recur every time a migration is regenerated.
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
