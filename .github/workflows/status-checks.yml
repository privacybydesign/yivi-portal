# Status checks, using the shared workflows from privacybydesign/github-workflows.
# The gate job "Status checks passed" is the one check to require.
name: Status checks

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  frontend:
    uses: privacybydesign/github-workflows/.github/workflows/node-checks.yml@v1
    permissions:
      contents: read
    with:
      working-directory: portal_spa
      node-version: "22" # same major as Dockerfile.react
      scripts: lint test build
      ignore-scripts: true

  # There is no shared Python workflow; these two jobs carry over the old
  # ruff-linter.yml and the test step of django-container.yml.
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.3"

      # The rule set is pinned in [tool.ruff.lint] in pyproject.toml.
      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff linter
        run: ruff check .

  django-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the Django image
        run: docker build --file Dockerfile.django --tag portal-api:test .

      # Inside the image, like before: some tests read /app/config.json.
      - name: Run tests
        run: docker run --env-file .env.testing --rm portal-api:test python manage.py test

  # Builds and scans both images without pushing them; Delivery pushes from main.
  docker:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image-name: ghcr.io/privacybydesign/django-portal
            context: .
            dockerfile: Dockerfile.django
          - image-name: ghcr.io/privacybydesign/react-portal
            context: portal_spa
            dockerfile: portal_spa/Dockerfile.react
    uses: privacybydesign/github-workflows/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      image-name: ${{ matrix.image-name }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      push-image: false

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: privacybydesign/github-workflows/.github/workflows/dependency-review.yml@v1
    permissions:
      contents: read
      pull-requests: write

  workflow-lint:
    uses: privacybydesign/github-workflows/.github/workflows/workflow-lint.yml@v1
    permissions:
      contents: read

  passed:
    name: Status checks passed
    if: always()
    needs: [frontend, ruff, django-tests, docker, dependency-review, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if grep -qE '"(failure|cancelled)"' <<< "$RESULTS"; then exit 1; fi
